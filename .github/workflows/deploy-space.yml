name: Deploy Hugging Face Space

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Hugging Face token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN GitHub Actions secret is not configured."
            exit 1
          fi

      - name: Configure Space runtime secret
        env:
          HF_DEPLOY_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_RUNTIME_TOKEN: ${{ secrets.HF_INFERENCE_TOKEN || secrets.HF_TOKEN }}
        run: |
          pip install "huggingface_hub>=0.34,<1"
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          deploy_token = os.environ["HF_DEPLOY_TOKEN"]
          runtime_token = os.environ["HF_RUNTIME_TOKEN"]
          api = HfApi(token=deploy_token)
          api.add_space_secret(
              repo_id="Athipan01/AI_image",
              key="HF_TOKEN",
              value=runtime_token,
              description="Inference token managed by AI_image_hf GitHub Actions",
          )
          print("Configured HF_TOKEN secret for Athipan01/AI_image")
          PY

      - name: Sync repository to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git remote add space "https://Athipan01:${HF_TOKEN}@huggingface.co/spaces/Athipan01/AI_image"
          git push --force space HEAD:main
