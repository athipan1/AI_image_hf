name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install test dependencies
        run: |
          pip install -r requirements.txt
          pip install 'gradio>=6,<7' 'huggingface_hub>=1.2,<2' 'pytest>=8,<9'

      - name: Run tests
        env:
          HF_TOKEN: test-token
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q
